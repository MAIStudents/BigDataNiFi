services:
  postgres:
    image: postgres:17
    container_name: bigdatanifi_postgres
    environment:
      POSTGRES_DB: bigdatanifi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bigdatanifi"]
      interval: 5s
      timeout: 5s
      retries: 12

  kafka:
    image: apache/kafka:3.9.0
    container_name: bigdatanifi_kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 10s
      retries: 24

  producer:
    build: ./producer
    container_name: bigdatanifi_producer
    volumes:
      - ./исходные данные:/data:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  nifi:
    build: ./nifi
    container_name: bigdatanifi_nifi
    environment:
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: bigdatanifi12
      NIFI_SENSITIVE_PROPS_KEY: bigdatanifi-secret-key
    ports:
      - "8443:8443"
    volumes:
      - ./nifi/flow:/flowconf:ro
    entrypoint:
      - bash
      - -c
      - "[ -f /flowconf/flow.json.gz ] && cp /flowconf/flow.json.gz /opt/nifi/nifi-current/conf/flow.json.gz; exec /opt/nifi/scripts/start.sh"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sk https://$$(hostname):8443/nifi-api/flow/status > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 36

  metabase:
    image: metabase/metabase:v0.51.9
    container_name: bigdatanifi_metabase
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
